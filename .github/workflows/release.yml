name: Build and release Atlas Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v0.1.0)
        required: true
        default: v0.1.0
      prerelease:
        description: Mark this as a prerelease
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  build_release:
    name: Build Atlas Launcher
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release
    secrets: inherit

  create_release:
    name: Publish GitHub release
    needs: build_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: AtlasLauncher-source

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded-artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files source-package

          source_dir="AtlasLauncher-${RELEASE_TAG}"
          mkdir -p "source-package/${source_dir}"
          rsync -a --exclude='.git' AtlasLauncher-source/ "source-package/${source_dir}/"
          (
            cd source-package
            zip -q -r -9 "../release-files/AtlasLauncher-Source-${RELEASE_TAG}.zip" "${source_dir}"
          )

          while IFS= read -r -d '' artifact_dir; do
            artifact_name="$(basename "${artifact_dir}")"
            artifact_name="${artifact_name//PrismLauncher/AtlasLauncher}"
            file_count="$(find "${artifact_dir}" -type f | wc -l)"

            if [[ "${file_count}" -eq 1 ]]; then
              artifact="$(find "${artifact_dir}" -type f -print -quit)"
              filename="$(basename "${artifact}")"
              case "${filename}" in
                *.tar.gz) extension=.tar.gz ;;
                *.AppImage.zsync) extension=.AppImage.zsync ;;
                *) extension=".${filename##*.}" ;;
              esac
              [[ "${artifact_name}" == *"${extension}" ]] || artifact_name="${artifact_name}${extension}"
              cp "${artifact}" "release-files/${artifact_name}"
            else
              (
                cd "${artifact_dir}"
                zip -q -r -9 "${GITHUB_WORKSPACE}/release-files/${artifact_name}.zip" .
              )
            fi
          done < <(find downloaded-artifacts -mindepth 1 -maxdepth 1 -type d -print0)

          (
            cd release-files
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Atlas Launcher ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: release-files/*
